[package]
name = "taikolabs-shell"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "Desktop shell for the Taiko multiview"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools" keeps the developer tools reachable in release builds too; the shell is
# a debugging aid for the multiview as much as a way to watch it.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
ureq = "2"

[profile.release]
lto = true
strip = true
