# Tests on every push and pull request; the backend (and with it venues.json) deploys
# to Azure Container Apps from main once the repository is set up for it - see the
# deploy job. The frontend is not deployed on its own: the image built there carries it
# in the API's wwwroot, so one container serves both (see "배포" in README.md).

name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/TaikoLabs.Api.Tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/

  # Builds the image from main, pushes it to ghcr under the short commit hash (the same tag
  # a hand build gets), and points the dev server at it. Production is never deployed from
  # here: once the dev server looks right, the same tag goes to it by hand (README "배포").
  # Off until the repository is given what it needs (Settings → Secrets and variables → Actions):
  #   secret   AZURE_CREDENTIALS   output of `az ad sp create-for-rbac --sdk-auth` scoped to the resource group
  #   variable AZURE_RESOURCE_GROUP, AZURE_CONTAINERAPP   rg-taiko-multiview / taiko-multiview-dev
  #   variable DEPLOY_BACKEND = true
  # and the ghcr package lets this repository write to it (package settings → Manage Actions
  # access → add the repository with the Write role), since it was first pushed by hand.
  # The container app keeps its own environment variables (the YouTube key among them);
  # this only ships new code and a new venues.json. Nothing here requests the dev server
  # itself: its ingress only admits the work PC, so a runner would get 403.
  deploy-backend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_BACKEND == 'true'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/ironhiro/taiko-multiview:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.tag }}
          build-args: BUILD_VERSION=${{ steps.tag.outputs.version }}
          push: true
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: >
          az containerapp update
          --name "${{ vars.AZURE_CONTAINERAPP }}"
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --image "${{ steps.tag.outputs.tag }}"
